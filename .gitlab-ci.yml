# 秋萤云台 · AkiHotaru 自动化 CI/CD
# 流程: 前端构建 -> 后端交叉编译 -> 通过 SSH 原子部署 + systemd 重启 -> 连通性健康检查
# 依赖 CI 变量:
#   DEPLOY_HOST - 部署主机 SSH 目标 (例: ops@your-server-ip)
#   VERIFY_URL  - 部署后验证地址 (例: http://your-server-ip:9800)
#   OPSWEB_USER - 运维面板登录用户名
#   OPSWEB_PASS - 运维面板登录密码
#   VERIFY_USER / VERIFY_PASS - 验证阶段登录会话用

stages:
  - build-frontend
  - build-backend
  - deploy
  - verify

variables:
  GOPROXY: "https://goproxy.cn,direct"
  NPM_CONFIG_REGISTRY: "https://registry.npmmirror.com"
  DEPLOY_HOST: "${OPS_DEPLOY_HOST:-ops@127.0.0.1}"
  VERIFY_URL: "${OPS_VERIFY_URL:-http://127.0.0.1:9800}"
  APP_DIR: "/workspace/opsweb"

default:
  after_script:
    - |
      if [ "$CI_JOB_STATUS" = "failed" ]; then
        echo "CI_FAIL_REASON: job=${CI_JOB_NAME} stage=${CI_JOB_STAGE} pipeline=${CI_PIPELINE_ID} sha=${CI_COMMIT_SHORT_SHA} project=${CI_PROJECT_PATH}"
      fi

build-frontend:
  stage: build-frontend
  image: node:18-bullseye
  cache:
    key: opsweb-npm
    paths:
      - .npm/
  script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline || npm install --cache .npm --prefer-offline
    - npm run build
  artifacts:
    paths:
      - backend/internal/web/dist/
    expire_in: 1 hour

build-backend:
  stage: build-backend
  image: golang:1.24-alpine
  dependencies:
    - build-frontend
  needs:
    - job: build-frontend
      artifacts: true
  cache:
    key: opsweb-go
    paths:
      - .gomod/
  script:
    - apk add --no-cache git curl >/dev/null
    - cd backend
    - GOMODCACHE="$CI_PROJECT_DIR/.gomod" go mod download
    - GOMODCACHE="$CI_PROJECT_DIR/.gomod" CGO_ENABLED=0 go test ./...
    - |
      GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build \
        -ldflags "-s -w -X main.version=${CI_COMMIT_SHORT_SHA} -X main.buildTime=$(date +%Y-%m-%d_%H:%M)" \
        -o "$CI_PROJECT_DIR/opsweb-linux-amd64" ./cmd/server
  artifacts:
    paths:
      - opsweb-linux-amd64
    expire_in: 1 hour

deploy:
  stage: deploy
  image: alpine:3.20
  dependencies:
    - build-backend
  needs:
    - job: build-backend
      artifacts: true
  script:
    - apk add --no-cache openssh-client >/dev/null
    - chmod 600 opsweb-linux-amd64
    - mkdir -p ~/.ssh && base64 -d "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
    - scp -o StrictHostKeyChecking=no opsweb-linux-amd64 "$DEPLOY_HOST:/tmp/opsweb-ci-$CI_PIPELINE_ID"
    - |
      ssh -o StrictHostKeyChecking=no "$DEPLOY_HOST" bash -s <<EOF
      set -e
      sudo -n systemctl stop opsweb || true
      cp /tmp/opsweb-ci-$CI_PIPELINE_ID $APP_DIR/opsweb
      chmod +x $APP_DIR/opsweb
      rm -f /tmp/opsweb-ci-$CI_PIPELINE_ID
      sudo -n systemctl start opsweb
      sleep 2
      systemctl is-active opsweb
      EOF

verify:
  stage: verify
  image: alpine:3.20
  script:
    - apk add --no-cache curl jq >/dev/null
    - |
      TOKEN=$(curl -s --max-time 10 -X POST ${VERIFY_URL}/api/login \
        -H 'Content-Type: application/json' \
        -d "{\"username\":\"$VERIFY_USER\",\"password\":\"$VERIFY_PASS\"}" | jq -r '.data.token // empty')
      [ -n "$TOKEN" ] || { echo 'login failed'; exit 1; }
      VERSION=$(curl -s --max-time 10 -H "Authorization: Bearer $TOKEN" ${VERIFY_URL}/api/version)
      echo "deployed: $VERSION"
      echo "$VERSION" | grep -q "version"
    - |
      for i in 1 2 3; do
        CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 ${VERIFY_URL}/)
        [ "$CODE" = "200" ] && echo "SPA OK: $CODE" && exit 0
        sleep 3
      done
      echo "SPA check failed" && exit 1
